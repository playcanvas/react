name: Changesets

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CI: true

jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'playcanvas' }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build packages for publishing
        run: pnpm run build:lib && pnpm run build:blocks
      
      - name: Create and publish versions
        uses: changesets/action@v2
        with:
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: pnpm -w changeset publish
          create-github-releases: true
